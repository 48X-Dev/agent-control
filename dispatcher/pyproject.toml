[project]
name = "agent-control-dispatcher"
version = "0.1.0"
description = "Task dispatcher for Agent Control - section 14 slice 1 (file source, one agent, one step)"
requires-python = ">=3.12"
dependencies = [
    "agent-control-models",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]
authors = [
    {name = "Agent Control Team"}
]
license = {text = "Apache-2.0"}

[project.scripts]
agent-control-dispatch = "agent_control_dispatcher.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_control_dispatcher"]

[tool.uv.sources]
agent-control-models = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
