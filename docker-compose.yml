# Agent Control Server - Docker Compose Configuration
#
# Quick Start:
#   docker compose up -d
#   AGENT_CONTROL_SERVER_HOST_PORT=18000 AGENT_CONTROL_DB_HOST_PORT=15432 docker compose up -d
#   AGENT_CONTROL_POSTGRES_PASSWORD=agent_control_local docker compose up -d
#
# Services:
#   - PostgreSQL database (port 5432)
#   - Agent Control Server API (port 8000), which also serves the UI dashboard
#     at http://localhost:8000/ui
#
# The image is published to Docker Hub at:
#   galileoai/agent-control-server:latest
#
# This compose file pulls the prebuilt server image from Docker Hub.
# For local development (run the server with uvicorn, or run the UI separately
# from ui/ with `make ui-dev`, which serves it on port 4000 - the default of
# AGENT_CONTROL_CORS_ORIGINS below), use:
#   docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: agent_control_postgres
    ports:
      - "${AGENT_CONTROL_DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: agent_control
      POSTGRES_USER: agent_control
      POSTGRES_PASSWORD: "${AGENT_CONTROL_POSTGRES_PASSWORD:-agent_control}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_control -d agent_control"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    # Both default to the published amd64 image. To run a locally built image
    # (e.g. to test unreleased changes), set these in .env:
    #   docker build -t agent-control-server:local -f server/Dockerfile .
    #   AGENT_CONTROL_SERVER_IMAGE=agent-control-server:local
    #   AGENT_CONTROL_SERVER_PLATFORM=linux/arm64   # match your host
    platform: ${AGENT_CONTROL_SERVER_PLATFORM:-linux/amd64}
    image: ${AGENT_CONTROL_SERVER_IMAGE:-galileoai/agent-control-server:latest}
    container_name: agent_control_server
    ports:
      - "${AGENT_CONTROL_SERVER_HOST_PORT:-8000}:8000"
    environment:
      # Database connection uses the Docker service name and the container port.
      # AGENT_CONTROL_DB_HOST_PORT only controls the host-side port mapping.
      AGENT_CONTROL_DB_URL: "postgresql+psycopg://agent_control:${AGENT_CONTROL_POSTGRES_PASSWORD:-agent_control}@postgres:5432/agent_control"
      # Server configuration
      AGENT_CONTROL_HOST: 0.0.0.0
      AGENT_CONTROL_PORT: 8000
      # API authentication (override via host env or server/.env; see server/.env.example)
      AGENT_CONTROL_API_KEY_ENABLED: ${AGENT_CONTROL_API_KEY_ENABLED:-false}
      AGENT_CONTROL_API_KEYS: ${AGENT_CONTROL_API_KEYS:-}
      AGENT_CONTROL_ADMIN_API_KEYS: ${AGENT_CONTROL_ADMIN_API_KEYS:-}
      AGENT_CONTROL_SESSION_SECRET: ${AGENT_CONTROL_SESSION_SECRET:-}
      AGENT_CONTROL_CORS_ORIGINS: ${AGENT_CONTROL_CORS_ORIGINS:-http://localhost:4000}
      # Agent executor. Off by default; while off the chat endpoints answer 503
      # and nothing else changes. Read the "Agent executor" block in
      # server/.env.example before enabling - it requires API keys to be on.
      AGENT_CONTROL_EXECUTOR_ENABLED: ${AGENT_CONTROL_EXECUTOR_ENABLED:-false}
      AGENT_CONTROL_EXECUTOR_SHARED_SECRET: ${AGENT_CONTROL_EXECUTOR_SHARED_SECRET:-}
      AGENT_CONTROL_EXECUTOR_TIMEOUT_SECONDS: ${AGENT_CONTROL_EXECUTOR_TIMEOUT_SECONDS:-30}
      AGENT_CONTROL_EXECUTOR_TURN_TIMEOUT_SECONDS: ${AGENT_CONTROL_EXECUTOR_TURN_TIMEOUT_SECONDS:-300}
      AGENT_CONTROL_EXECUTOR_ALLOW_INSECURE_LOCAL_DEV: ${AGENT_CONTROL_EXECUTOR_ALLOW_INSECURE_LOCAL_DEV:-false}
      # Linear milestones. The key is held server-side and never reaches the
      # browser; unset simply leaves the panel in its not-configured state.
      # Models an agent may be configured to run on. Empty list keeps the model
      # half of agent configuration inert; the system prompt works regardless.
      AGENT_CONTROL_MODELS_ALLOWLIST: ${AGENT_CONTROL_MODELS_ALLOWLIST:-[]}
      AGENT_CONTROL_LINEAR_API_KEY: ${AGENT_CONTROL_LINEAR_API_KEY:-}
      AGENT_CONTROL_LINEAR_TIMEOUT_SECONDS: ${AGENT_CONTROL_LINEAR_TIMEOUT_SECONDS:-10}
      AGENT_CONTROL_LINEAR_CACHE_TTL_SECONDS: ${AGENT_CONTROL_LINEAR_CACHE_TTL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Task dispatcher. Comes up with `docker compose up` and idles until somebody
  # presses play in the console. This is the line that used to default to
  # `--help`, and it defaulted to that because the only subcommand was `once`,
  # which reads a source, imports what it finds and spends real model budget on
  # the operator's account. Starting a stack must not bill anybody.
  #
  # `serve` does not have that property, which is why it can be the default. It
  # reads no source and imports nothing: it polls the queue for rows that
  # already exist and claims those. A queued row exists because a human pressed
  # play over a list of issues they could see, or because somebody ran `once`
  # from cron on purpose. So an idle stack costs two small GETs every few
  # seconds - the dispatch state, then the queue - plus a sweep for rows whose
  # holder died once a minute. A paused namespace skips the queue read and
  # costs one every thirty.
  #
  # A one-shot pass over a source is still a `run`, and still by hand:
  #
  #   docker compose run --rm agent-dispatcher once \
  #       --source linear-milestone:<id> --team operations --agent <agent-name>
  #
  # task-dispatcher.md section 4 puts this in docker-compose.dev.yml instead,
  # "following the precedent that file already sets for agent-executor". That
  # precedent does not exist - the dev file defines only postgres and a
  # database-init job - and it has no server for a dispatcher to talk to, so
  # following the letter would ship something that cannot work.
  agent-dispatcher:
    platform: ${AGENT_CONTROL_SERVER_PLATFORM:-linux/amd64}
    image: ${AGENT_CONTROL_DISPATCHER_IMAGE:-agent-control-dispatcher:local}
    build:
      context: .
      dockerfile: dispatcher/Dockerfile
    # No --agent, deliberately. It fills one gap - a task whose team has no
    # default_agent_name and whose workflow pins none - and a task in that state
    # stopping at `blocked` is the better answer than a compose default quietly
    # choosing who runs it. Add `--agent <name>` here only if you mean it.
    command: >-
      serve
      --poll-seconds ${AGENT_CONTROL_DISPATCHER_POLL_SECONDS:-5}
      --max-tasks ${AGENT_CONTROL_DISPATCHER_MAX_TASKS:-1}
    environment:
      AGENT_CONTROL_BASE_URL: http://server:8000
      # An ORDINARY key, not an admin one. The credential that runs agents must
      # not be the credential that approves their output (task-dispatcher.md
      # section 4), and nothing `serve` calls needs more than AUTHENTICATED.
      #
      # Set AGENT_CONTROL_DISPATCHER_API_KEY to ONE key. The fallback reads the
      # server's own list, which is comma-separated: with two keys configured
      # the dispatcher would be handed "key1,key2" as its single credential and
      # the server would reject it. That now exits 1 rather than idling, so the
      # container restart-loops visibly instead of silently claiming nothing.
      AGENT_CONTROL_API_KEY: ${AGENT_CONTROL_DISPATCHER_API_KEY:-${AGENT_CONTROL_API_KEYS:-}}
    depends_on:
      - server
    # Restarted on a crash, and it does not exit on the things that are not
    # crashes: a paused namespace, a spent hour, a server that is briefly
    # restarting. Those are backed off inside the loop, so the restart policy
    # never becomes the retry loop.
    restart: unless-stopped
    # Longer than a turn. SIGTERM stops it claiming and lets the task in flight
    # reach its own finish call; killing it before that leaves the row at
    # `running` until its lease lapses, which is recoverable and still ugly.
    stop_grace_period: 330s

volumes:
  pgdata:
