[project]
name = "agent-control-knowledge-sync"
version = "0.1.0"
description = "Mirrors an allowlisted Drive subtree and GitHub repos into the company knowledge corpus"
requires-python = ">=3.12"
dependencies = [
    "agent-control-models",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "SQLAlchemy[asyncio]>=2.0.0",
    # Two drivers because the DSN chooses, not this file: compose and
    # server/.env.example both say postgresql+psycopg://, and asyncpg is here
    # for a deployment that says postgresql+asyncpg:// instead.
    "psycopg>=3.1",
    "asyncpg>=0.29.0",
]
authors = [{name = "Agent Control Team"}]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
# MarkItDown (MIT), ~253MB. convert.py imports it lazily and reports
# `converter_unavailable` without it, so the sync starts either way.
#
# The extras list is the second half of one policy: convert.py's MIME table
# admits a type and this line installs its parser. server/pyproject.toml
# records what happens when the two drift - pdf-only was correct when written,
# the OOXML types were admitted later, and the first real .pptx died naming the
# wrong failure. Change one, change the other.
text-extraction = ["markitdown[pdf,pptx,docx,xlsx]>=0.1.7"]

[project.scripts]
agent-knowledge-sync = "agent_control_knowledge_sync.cli:main"
agent-knowledge-sync-bootstrap = "agent_control_knowledge_sync.bootstrap_drive:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_control_knowledge_sync"]
