[project]
name = "agent-control-models"
version = "8.4.0"
description = "Shared data models for Agent Control server and SDK"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.4",
    "jsonschema>=4.0.0",
    "google-re2>=1.1",
]
authors = [
    {name = "Agent Control Team"}
]
readme = "README.md"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
# MarkItDown (MIT), ~253MB. Optional: attachment_converter imports it inside the
# call that needs it and reports `converter_unavailable` without it.
#
# The extras list is one half of one policy, DEFAULT_CONVERTIBLE_MIMES the other.
# Admitting a type without installing its parser has shipped here before: the
# OOXML types were added after this line said pdf-only, and the first real .pptx
# was stored and then reported unreadable. Change one, change the other.
text-extraction = ["markitdown[pdf,pptx,docx,xlsx]>=0.1.7"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_control_models"]
