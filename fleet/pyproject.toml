[project]
name = "agent-control-fleet"
version = "8.4.0"
description = "Runs the executor containers fleet.yaml groups under Apple `container` and binds the runtime rows"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]
authors = [{name = "Agent Control Team"}]
license = {text = "Apache-2.0"}

[project.scripts]
agent-control-fleet = "agent_control_fleet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_control_fleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
