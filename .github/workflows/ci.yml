name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_control
          POSTGRES_USER: agent_control
          POSTGRES_PASSWORD: agent_control
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U agent_control -d agent_control" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: agent_control
      DB_PASSWORD: agent_control
      DB_DATABASE: agent_control

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      # postgresql-client is not optional: knowledge_provisioning.py shells out
      # to psql to run knowledge_db_init.sql, and without it every corpus test
      # skips and the build stays green.
      - name: Install libpq runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq5 postgresql-client

      - name: Show versions
        run: |
          uv --version
          python --version

      # A knowledge setting that exists in .env and reaches no process has
      # shipped four times here, and for the sync it presents as a successful
      # run over zero documents. Runs early: it needs nothing installed.
      - name: Company knowledge env parity
        run: python3 scripts/check_knowledge_env_parity.py

      - name: Verify contrib packaging contract
        run: make contrib-verify

      - name: Sync dependencies
        run: make sync

      - name: Run Python checks
        run: make check

      # The corpus tests skip when no Postgres answers, and `make check` stays
      # green when they do. Schema reflection is the only thing holding the
      # sync's table metadata to the server's migrations, so it has to actually
      # run. Same skip-guard idiom as adk-contract-ci below, same reason.
      - name: Knowledge corpus tests actually ran
        run: |
          set -o pipefail
          uv run --package agent-control-knowledge-sync --extra text-extraction \
            pytest knowledge_sync/tests/test_schema_reflection.py -q -rs \
            2>&1 | tee knowledge-corpus.log
          if grep -Eq "[0-9]+ skipped" knowledge-corpus.log; then
            echo "::error::The knowledge corpus tests skipped instead of running, so they proved nothing. Check that the Postgres service is reachable and that psql is on PATH."
            exit 1
          fi

      - name: Collect coverage files
        id: coverage_files
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path

          base_reports = [
              "coverage-models.xml",
              "coverage-engine.xml",
              "coverage-telemetry.xml",
              "coverage-server.xml",
              "coverage-sdk.xml",
              "coverage-dispatcher.xml",
              "coverage-knowledge-sync.xml",
          ]
          contrib_reports = sorted(path.name for path in Path(".").glob("coverage-evaluators-*.xml"))
          print(f"files={','.join([*base_reports, *contrib_reports])}")
          PY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ steps.coverage_files.outputs.files }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  ui-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        working-directory: ./ui
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: ./ui
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ui/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('ui/**/*.ts', 'ui/**/*.tsx', 'ui/**/*.js', 'ui/**/*.jsx', 'ui/package.json', 'ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      # The agent Configuration tab renders operator-authored prompts inside an
      # admin console whose session cookie is a valid credential on this API,
      # so a stored XSS there escalates straight to ADMIN. That directory
      # renders text nodes only. This grep is what survives the first person
      # who reaches for a diff library, since most of them emit HTML strings.
      - name: No raw HTML in the agent configuration tab
        run: |
          if grep -rn "dangerouslySetInnerHTML\|innerHTML" \
              ui/src/core/page-components/agent-detail/config/; then
            echo "::error::Raw HTML is not allowed in the agent configuration tab."
            exit 1
          fi

      # Same rule, same reason, one directory over. The chat panel renders
      # filenames chosen by whoever uploaded a file - or, on the tracker path,
      # by whoever filed the issue - plus model output and extracted document
      # text. There is no sanitizer here and there is not meant to be one.
      - name: No raw HTML in the chat panel
        run: |
          if grep -rn "dangerouslySetInnerHTML\|innerHTML" \
              ui/src/core/page-components/agent-detail/agent-chat/; then
            echo "::error::Raw HTML is not allowed in the chat panel."
            exit 1
          fi

      # Third directory, same rule, and here the untrusted author is anybody
      # who can add a file to an indexed Drive folder. The server neutralizes
      # the fence markers a model would act on and deliberately does not escape
      # markup, because escaping would corrupt the text an agent quotes - so
      # the rendering is the only thing between a document's author and this
      # console's DOM.
      - name: No raw HTML in the knowledge panel
        run: |
          if grep -rn "dangerouslySetInnerHTML\|innerHTML" \
              ui/src/core/page-components/knowledge/; then
            echo "::error::Raw HTML is not allowed in the knowledge panel."
            exit 1
          fi

      - name: Lint
        working-directory: ./ui
        run: pnpm run lint

      - name: Prettier check
        working-directory: ./ui
        run: pnpm run prettify:check

      - name: Type check
        working-directory: ./ui
        run: pnpm run typecheck

      - name: Install Playwright browsers
        working-directory: ./ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Next.js app
        working-directory: ./ui
        run: pnpm run build
        env:
          # Disable telemetry during build
          NEXT_TELEMETRY_DISABLED: 1
          # Optimize build for CI
          NODE_ENV: production
          # Skip unnecessary optimizations for test builds
          SKIP_ENV_VALIDATION: true

      - name: Run integration tests
        working-directory: ./ui
        run: pnpm run test:integration
        env:
          # Use production build for faster startup
          NODE_ENV: production

      - name: Run component tests
        working-directory: ./ui
        run: pnpm run test:ct

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: ui/test-results/
          retention-days: 3

  # sdks/python/tests/test_google_adk_managed_config_contract.py checks the five
  # ADK behaviours per-agent configuration is built on, against a real install.
  # Two of them are internal framework behaviour with no stability guarantee, so
  # a future google-adk can break the feature with no symptom anyone would trace
  # back: saves succeed, the dashboard reports the change, and the agent keeps
  # calling the old vendor. In the default suite the file skips, so it only
  # defends anything if a job like this one runs it.
  adk-contract-ci:
    runs-on: ubuntu-latest
    env:
      # Pinned rather than floating. A green build should mean "the version we
      # ship against still behaves"; tracking latest would instead turn an
      # upstream release into a red build on an unrelated PR on a day nobody
      # chose. Bump this deliberately - the failure it produces is the point.
      GOOGLE_ADK_VERSION: "2.6.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: make sync

      # `python -m pytest`, NOT `pytest`, and `--no-sync`, NOT a plain `uv run`.
      # The console script resolves out of the project venv, which does not
      # carry the overlay that `--with` installs, so `pytest` here reports 15
      # skips and a green tick while testing nothing - the precise failure this
      # job exists to catch. `--no-sync` is the other half: a plain sync drops
      # the workspace packages back out of the overlay. Simplifying either one
      # silently disarms the check, so the skip guard below fails the build
      # instead of letting that pass unnoticed.
      - name: Google ADK managed config contract
        run: |
          set -o pipefail
          uv run --no-sync --with "google-adk[extensions]==${GOOGLE_ADK_VERSION}" \
            python -m pytest \
            sdks/python/tests/test_google_adk_managed_config_contract.py -q -rs \
            2>&1 | tee adk-contract.log
          if grep -Eq "[0-9]+ skipped" adk-contract.log; then
            echo "::error::The google-adk contract suite skipped instead of running, so it proved nothing. Check that google-adk installed and that this step still uses 'python -m pytest' with '--no-sync'."
            exit 1
          fi

  sdk-ts-ci:
    runs-on: ubuntu-latest
    env:
      SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Sync Python dependencies
        run: make sync

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install TypeScript SDK dependencies
        working-directory: ./sdks/typescript
        run: pnpm install --frozen-lockfile

      - name: Install pinned Speakeasy CLI
        run: make -C sdks/typescript speakeasy-install

      - name: Test TypeScript SDK naming generator
        run: make sdk-ts-overlay-test

      - name: Lint TypeScript SDK
        run: make sdk-ts-lint

      - name: Typecheck TypeScript SDK
        run: make sdk-ts-typecheck

      - name: Test TypeScript SDK
        run: make sdk-ts-test

      - name: Build TypeScript SDK
        run: make sdk-ts-build

      - name: Verify generated TypeScript client is current
        run: make sdk-ts-generate-check

      - name: Verify generated method naming conventions
        run: make sdk-ts-name-check
