[project]
name = "agent-control-server"
version = "8.4.0"
description = "Server for Agent Control - manage and evaluate controls for AI agents"
requires-python = ">=3.12"
# Note: agent-control-models, agent-control-engine, and agent-control-telemetry
#       are bundled at build time
# Note: agent-control-evaluators is a runtime dependency (NOT vendored) to avoid
#       duplicate module conflict when galileo extras are installed
dependencies = [
    "fastapi>=0.109.0",
    "prometheus-client>=0.20.0",
    "starlette-exporter>=0.23.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",  # For auth_framework HTTP providers
    "python-multipart>=0.0.9",  # multipart/form-data on the attachment upload route
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "SQLAlchemy>=2.0.0",
    "psycopg>=3.1",
    "asyncpg>=0.29.0",
    "greenlet>=3.0",
    "alembic>=1.13.0",
    "jsonschema>=4.25.1",
    "jsonschema-rs>=0.22.0",
    "PyJWT>=2.8.0",
    "google-re2>=1.1",  # For engine (bundled)
    "agent-control-evaluators>=7.5.0",  # NOT vendored - avoid conflict with galileo
]
authors = [
    {name = "Agent Control Team"}
]
readme = "README.md"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
galileo = ["agent-control-evaluator-galileo>=7.5.0"]
binary = ["psycopg[binary]>=3.1"]
c = ["psycopg[c]>=3.1"]
# Attachment conversion. Both are optional and both cost real disk, so the
# price is written here rather than discovered from an image that doubled.
# Neither is imported at module scope: without them the converter reports
# `converter_unavailable` and names the missing one, and the server starts.
#
# text-extraction: MarkItDown 0.1.7 (MIT), ~253MB / 38 packages. Reads a
#   document's text layer. Only the `pdf` extra is taken: the office extras add
#   parsers for formats `attachment_accepted_mimes` refuses, which is parser
#   surface bought for nothing.
# ocr: Docling (MIT), ~1.0GB / 103 packages, torch on CPU. Measured at 47.5s on
#   a one-line PDF and 0.5s on a small PNG in this workspace on 2026-08-03.
#   Not a rare escalation: five of this workspace's six real attachments carry
#   no text layer at all, so on this corpus it is the main path.
text-extraction = ["markitdown[pdf]>=0.1.7"]
ocr = ["docling>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-jsonschema>=4.23.0",
    "agent-control-models",
    "agent-control-engine",
    "agent-control-telemetry",
    "agent-control-evaluators",
]

[project.scripts]
agent-control-server = "agent_control_server.main:run"
agent-control-migrate = "agent_control_server.migrate:main"



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Note: agent_control_models, agent_control_engine, and agent_control_telemetry
# are copied by scripts/build.py
# Note: agent_control_evaluators is a runtime dep, not vendored
packages = [
    "src/agent_control_server",
    "src/agent_control_models",
    "src/agent_control_engine",
    "src/agent_control_telemetry",
]

# Ship Alembic migration scripts and config inside the wheel so that
# non-Docker consumers (e.g. wheel-based deployments) can run migrations
# via the `agent-control-migrate` console script without vendoring.
[tool.hatch.build.targets.wheel.force-include]
"alembic" = "agent_control_server/_alembic"
"alembic.ini" = "agent_control_server/_alembic.ini"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
concurrency = ["thread", "greenlet"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["agent_control_server"]

# For local development, use workspace packages
[tool.uv.sources]
agent-control-models = { workspace = true }
agent-control-engine = { workspace = true }
agent-control-telemetry = { workspace = true }
agent-control-evaluators = { workspace = true }
# For local dev: use local galileo package instead of PyPI
agent-control-evaluator-galileo = { path = "../evaluators/contrib/galileo", editable = true }
