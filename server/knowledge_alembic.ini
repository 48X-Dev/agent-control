# Alembic configuration for the company-knowledge corpus database.
#
# Deliberately a second config with a second script directory. `alembic.ini`
# owns `agent_control`, whose schema the control plane declares as SQLAlchemy
# metadata and autogenerates against; `agent_knowledge` is a different database,
# owned by a different role, written by a different process, and a corpus schema
# has no business in the control plane's autogenerate surface.
#
# Run it explicitly:
#
#   cd server && AGENT_KNOWLEDGE_DB_URL=postgresql+psycopg://knowledge_sync:...@host:5432/agent_knowledge \
#     uv run --with alembic alembic -c knowledge_alembic.ini upgrade head
#
# Or `make -C server knowledge-migrate`. The URL must be the *sync* role: these
# migrations create tables and the reader holds SELECT only.

[alembic]
script_location = knowledge_alembic
version_table = knowledge_alembic_version
