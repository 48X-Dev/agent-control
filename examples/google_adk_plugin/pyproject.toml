[project]
name = "agent-control-google-adk-plugin-example"
version = "0.1.0"
description = "Google ADK packaged plugin integration example for Agent Control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-control-engine",
    "agent-control-evaluators",
    "agent-control-models",
    "agent-control-telemetry",
    "agent-control-sdk",
    "google-adk>=1.0.0,<2.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    # The OpenAI-compatible route, which is the only route the fleet has: this
    # module and the SDK's managed-model swap both import
    # google.adk.models.lite_llm. google-adk carries it under `extensions`,
    # alongside crewai and langchain, so it is named directly instead. The floor
    # is 1.83.14 because every earlier version pins jsonschema==4.23.0 and
    # agent-control-server needs >=4.25.1, which one workspace cannot satisfy.
    "litellm>=1.83.14,<2",
    # ADK resolves the driver from the --session_service_uri scheme and raises
    # at startup when it is absent. The fleet points executors at adk_runtime
    # over postgresql+asyncpg, so without this the container exits before it
    # binds. Same floor as server and knowledge_sync.
    "asyncpg>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_agent"]

[tool.uv.sources]
agent-control-sdk = { workspace = true }
agent-control-models = { workspace = true }
agent-control-engine = { workspace = true }
agent-control-evaluators = { workspace = true }
agent-control-telemetry = { workspace = true }
