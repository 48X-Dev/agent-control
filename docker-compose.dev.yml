# Agent Control Server - Local Development Docker Compose
#
# This file is used for local development with `make server-run`.
# It starts PostgreSQL, allowing you to run the server locally with uvicorn,
# plus a one-shot job that provisions the agent executor's separate database
# and its dedicated Postgres role (see server/scripts/adk_db_init.sql).
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   AGENT_CONTROL_DB_HOST_PORT=15432 docker compose -f docker-compose.dev.yml up -d
#   cd server && uvicorn main:app --reload
#   OR
#   make server-run  (handles this automatically)
#
# For running both Postgres + Server in Docker, use docker-compose.yml instead.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${AGENT_CONTROL_DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: agent_control
      POSTGRES_USER: agent_control
      # Same variable and default as docker-compose.yml. Both files mount the
      # same named pgdata volume in the same compose project, so they have to
      # agree on the password or whichever one did not initialise the volume
      # will hand out credentials that do not work.
      POSTGRES_PASSWORD: "${AGENT_CONTROL_POSTGRES_PASSWORD:-agent_control}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_control -d agent_control"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot provisioning for the agent executor's database. Runs to completion
  # and exits; `docker compose up` starts it again on every run, which is fine
  # because server/scripts/adk_db_init.sql is idempotent.
  #
  # This cannot be a /docker-entrypoint-initdb.d script: the postgres service
  # above mounts a named volume, and the Postgres image runs init scripts only
  # against an empty data directory, so nobody with an existing volume would
  # ever get the database.
  #
  # It creates adk_runtime owned by a dedicated `adk` role, and closes the
  # control-plane database to that role. The executor is a process running
  # model-driven agent code; if it connected as `agent_control` it could
  # rewrite the controls and policies that govern it, which is reachable
  # through ordinary prompt injection into a tool result.
  adk-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Superuser credentials for provisioning only. This container exits
      # before any agent code exists; the executor service never gets them.
      # Must track the postgres service above, including a password set in
      # .env - otherwise this job cannot authenticate on any install that
      # changed it from the default.
      PGPASSWORD: "${AGENT_CONTROL_POSTGRES_PASSWORD:-agent_control}"
      ADK_DB_PASSWORD: "${ADK_DB_PASSWORD:-adk_local}"
    volumes:
      - ./server/scripts/adk_db_init.sql:/adk_db_init.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      # Second run closes the local pytest database, which carries the same
      # control-plane schema. It is created by server/tests/conftest.py rather
      # than by compose, so it may not exist; the script skips a missing
      # control database and exits 0.
      - >
        psql -v ON_ERROR_STOP=1 -h postgres -U agent_control -d postgres
        -v adk_password="$${ADK_DB_PASSWORD}"
        -f /adk_db_init.sql
        &&
        psql -v ON_ERROR_STOP=1 -h postgres -U agent_control -d postgres
        -v adk_password="$${ADK_DB_PASSWORD}"
        -v control_db=agent_control_test
        -f /adk_db_init.sql
    restart: "no"

  # One-shot provisioning for the company-knowledge corpus, beside adk-db-init
  # and for the same reasons: a named volume means /docker-entrypoint-initdb.d
  # never runs, pg_dump does not carry database-level privileges, and
  # CREATE DATABASE cannot live in a migration. Idempotent, so it runs on every
  # `up`.
  #
  # It creates agent_knowledge owned by `knowledge_sync`, a `knowledge_read`
  # role holding SELECT and nothing else, and closes the control-plane database
  # to both. The sync process parses hostile bytes from any document in the
  # mirror; if it connected as `agent_control` it could rewrite the controls
  # that govern the agents doing the asking.
  knowledge-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: "${AGENT_CONTROL_POSTGRES_PASSWORD:-agent_control}"
      KNOWLEDGE_DB_PASSWORD: "${KNOWLEDGE_DB_PASSWORD:-knowledge_local}"
      KNOWLEDGE_READ_DB_PASSWORD: "${KNOWLEDGE_READ_DB_PASSWORD:-knowledge_read_local}"
    volumes:
      - ./server/scripts/knowledge_db_init.sql:/knowledge_db_init.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      # Second run closes the local pytest database, exactly as adk-db-init
      # does. It is created by server/tests/conftest.py rather than by compose,
      # so it may not exist; the script skips a missing control database and
      # exits 0.
      - >
        psql -v ON_ERROR_STOP=1 -h postgres -U agent_control -d postgres
        -v knowledge_sync_password="$${KNOWLEDGE_DB_PASSWORD}"
        -v knowledge_read_password="$${KNOWLEDGE_READ_DB_PASSWORD}"
        -f /knowledge_db_init.sql
        &&
        psql -v ON_ERROR_STOP=1 -h postgres -U agent_control -d postgres
        -v knowledge_sync_password="$${KNOWLEDGE_DB_PASSWORD}"
        -v knowledge_read_password="$${KNOWLEDGE_READ_DB_PASSWORD}"
        -v control_db=agent_control_test
        -f /knowledge_db_init.sql
    restart: "no"

volumes:
  pgdata:
